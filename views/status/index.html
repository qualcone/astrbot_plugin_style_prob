<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>频率状态</title>
<style>
  /* 配色由页面自己定义（浅色 / 深色两套，均为不透明背景），不依赖宿主传来的颜色变量：
     宿主的变量在部分情况下取不到深色值，会出现“深色字落在深色底上”看不清的问题。
     深色与否由下方脚本判断后写到 <html data-theme>；脚本没跑起来时按系统偏好。 */
  :root {
    color-scheme: light;
    --bg: #ffffff; --surface: #ffffff; --text: #1b1c1d; --muted: #5f6368; --border: #d0d0d0;
    --primary: #3c96ca; --error: #d93025; --track: #e3e5e8;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1a1a; --surface: #242424; --text: #e8eaed; --muted: #b4b8be; --border: #3a3a3a;
    --primary: #5ba4d4; --error: #ff6b6d; --track: #3a3a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #1a1a1a; --surface: #242424; --text: #e8eaed; --muted: #b4b8be; --border: #3a3a3a;
      --primary: #5ba4d4; --error: #ff6b6d; --track: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); min-height: 100vh;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 20px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button { background: var(--primary); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit; }
  button:disabled { opacity: .6; cursor: default; }
  label { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 20px; font-weight: 600; margin-top: 2px; word-break: break-all; }
  .card .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .warn { border: 1px solid var(--error); color: var(--error); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .note { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 8px 0; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.umo { word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; max-width: 360px; }
  td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meter { position: relative; height: 8px; min-width: 90px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .meter > i { position: absolute; inset: 0 auto 0 0; background: var(--primary); border-radius: 4px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .err { color: var(--error); }
</style>
</head>
<body>
<h1>频率状态</h1>
<p class="sub" id="sub">加载中…</p>

<div class="bar">
  <button id="refresh">刷新</button>
  <label><input type="checkbox" id="auto" checked> 每 10 秒自动刷新</label>
  <span class="sub" id="updated"></span>
</div>

<div id="alerts"></div>
<div class="cards" id="cards"></div>

<h2>各会话当前位置</h2>
<p class="sub" id="sessionsHint"></p>
<div id="sessions"></div>

<h2>最近注入记录</h2>
<p class="sub" id="recentHint"></p>
<div id="recent"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var timer = null;

  // 判断是否深色：宿主传来了真实的主题色时以它为准（背景亮度），否则看 isDark 或系统偏好。
  function luminance(hex) {
    var m = /^#?([0-9a-f]{6})/i.exec(String(hex || ""));
    if (!m) return null;
    var n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  }
  function applyTheme(ctx) {
    var dark;
    var lum = ctx && ctx.themeColors ? (luminance(ctx.themeColors.background) !== null ?
      luminance(ctx.themeColors.background) : luminance(ctx.themeColors.surface)) : null;
    if (lum !== null) dark = lum < 0.5 || (ctx && ctx.isDark === true);
    else dark = !!(ctx && ctx.isDark === true) ||
      !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);   // 一律用 textContent，避免会话名里的特殊字符被当作 HTML
    return e;
  }
  function pct(x) { return (x * 100).toFixed(1) + "%"; }
  function num(x, d) { return x === null || x === undefined ? "-" : Number(x).toFixed(d === undefined ? 0 : d); }
  function ago(ts, now) {
    var s = Math.max(0, Math.round((now - ts)));
    if (s < 60) return s + " 秒前";
    if (s < 3600) return Math.floor(s / 60) + " 分钟前";
    if (s < 86400) return Math.floor(s / 3600) + " 小时前";
    return Math.floor(s / 86400) + " 天前";
  }
  function card(k, v, s) {
    var c = el("div", "card");
    c.appendChild(el("div", "k", k));
    c.appendChild(el("div", "v", v));
    if (s) c.appendChild(el("div", "s", s));
    return c;
  }

  var RESULT = { hit: "出现", miss: "未出现", failed: "判定失败", pending: "判定中…", skipped: "未判定" };

  function renderRecent(d) {
    var box = $("recent"), rows = d.recent || [];
    box.textContent = "";
    $("recentHint").textContent = "只记录被注入的轮次，最多保留最近 " + (d.recent_limit || 200) +
      " 条，仅保存在内存中，重启后清空；回复只保留开头一小段。";
    if (!rows.length) { box.appendChild(el("div", "empty", "还没有注入记录")); return; }
    var table = el("table"), head = el("tr");
    ["时间", "会话", "第 k 条", "注入概率", "判定", "用时", "回复开头"].forEach(function (h) { head.appendChild(el("th", "", h)); });
    table.appendChild(head);
    rows.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "num", new Date(r.ts * 1000).toLocaleTimeString()));
      tr.appendChild(el("td", "umo", r.umo));
      tr.appendChild(el("td", "num", "第 " + r.k + " 条"));
      tr.appendChild(el("td", "num", pct(r.prob)));
      var res = el("td", "num", RESULT[r.result] || r.result);
      if (r.result === "failed") res.className += " err";
      tr.appendChild(res);
      tr.appendChild(el("td", "num", r.ms === null || r.ms === undefined ? "-" : r.ms + " ms"));
      tr.appendChild(el("td", "", r.snippet));
      table.appendChild(tr);
    });
    box.appendChild(table);
  }

  function render(d) {
    $("sub").textContent = (d.enabled ? "插件已启用" : "插件已关闭") + " · " + d.intensity_label;

    var alerts = $("alerts");
    alerts.textContent = "";
    if (d.stale) alerts.appendChild(el("div", "note", "设置（档位 / 概率参数 / 风格指令）已更改，累计数据来自旧设置，可用 /风格清空 清除。"));
    (d.warnings || []).forEach(function (w) { alerts.appendChild(el("div", "warn", "⚠ " + w)); });

    var t = d.totals, p = d.params, cards = $("cards");
    cards.textContent = "";
    cards.appendChild(card("概率曲线", num(p.p0 * 100, 1) + "% → " + num(p.p_max * 100, 1) + "%",
      p.ramp_steps === 0 ? "直接使用上限" : "经 " + p.ramp_steps + " 条升到上限"));
    cards.appendChild(card("理论平均间隔", d.expected_interval === null ? "永不触发" : num(d.expected_interval, 1) + " 条",
      "每 100 条约注入 " + num(d.expected_per_100, 1) + " 次"));
    cards.appendChild(card("实测平均间隔", d.measured_interval === null ? "暂无数据" : num(d.measured_interval, 1) + " 条",
      d.interval_count + " 个间隔"));
    cards.appendChild(card("累计回复", t.messages, "注入 " + t.injected + " 次"));
    cards.appendChild(card("判为出现", t.hits, "判定 " + t.judged + " 次，失败 " + t.judge_failed + " 次"));
    cards.appendChild(card("遵循率", t.inj_judged ? pct(t.inj_hits / t.inj_judged) : "暂无数据",
      "被注入后风格确实出现（样本 " + t.inj_judged + "）"));

    var box = $("sessions");
    box.textContent = "";
    var rows = d.sessions || [];
    $("sessionsHint").textContent = "共 " + d.session_count + " 个有记录的会话，按最近活跃排序" +
      (d.session_count > rows.length ? "，仅显示最近 " + rows.length + " 个" : "") +
      "。“第 k 条”指下一条消息是自上次触发后的第几条。";
    renderRecent(d);
    if (!rows.length) { box.appendChild(el("div", "empty", "还没有会话记录")); return; }

    var table = el("table"), head = el("tr");
    ["会话", "下一条", "距上次触发", "当前注入概率", "", "最近活跃"].forEach(function (h) { head.appendChild(el("th", "", h)); });
    table.appendChild(head);
    rows.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "umo", r.umo));
      tr.appendChild(el("td", "num", "第 " + r.k + " 条"));
      tr.appendChild(el("td", "num", (r.k - 1) + " 条"));
      tr.appendChild(el("td", "num", pct(r.prob)));
      var m = el("td"), meter = el("div", "meter"), fill = el("i");
      fill.style.width = Math.min(100, Math.max(0, r.prob * 100)) + "%";
      meter.appendChild(fill); m.appendChild(meter); tr.appendChild(m);
      tr.appendChild(el("td", "num", ago(r.ts, d.server_time)));
      table.appendChild(tr);
    });
    box.appendChild(table);
  }

  function load() {
    var btn = $("refresh");
    btn.disabled = true;
    return window.AstrBotPluginView.apiGet("status").then(function (data) {
      render(data);
      $("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
    }).catch(function (e) {
      $("updated").textContent = "";
      var a = $("alerts");
      a.textContent = "";
      a.appendChild(el("div", "warn err", "读取失败：" + (e && e.message ? e.message : e)));
    }).then(function () { btn.disabled = false; });
  }

  function schedule() {
    if (timer) { clearInterval(timer); timer = null; }
    if ($("auto").checked) timer = setInterval(load, 10000);
  }

  $("refresh").addEventListener("click", load);
  $("auto").addEventListener("change", schedule);
  // 宿主的桥接脚本是由面板注入的，位置在本脚本之后时还没就绪：等页面加载完成再启动。
  var started = false;
  function start() {
    var b = window.AstrBotPluginView;
    if (started || !b) return;
    started = true;
    if (typeof b.onContext === "function") b.onContext(applyTheme);   // 宿主切换主题时会再次触发
    else applyTheme(null);
    b.ready().then(function () { load(); schedule(); });
  }
  applyTheme(null);                                                   // 先按系统偏好上色，避免白屏闪烁
  if (window.AstrBotPluginView) start();
  else {
    window.addEventListener("load", start);
    var tries = 0, poll = setInterval(function () {                   // 兜底：load 没触发时轮询几秒
      if (window.AstrBotPluginView || ++tries > 50) { clearInterval(poll); start(); }
    }, 100);
  }
})();
</script>
</body>
</html>
